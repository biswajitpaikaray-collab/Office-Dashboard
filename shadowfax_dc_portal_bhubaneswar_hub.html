<script>
// DOM Selector & Helpers
const $ = s => document.querySelector(s);
const today = new Date().toISOString().slice(0,10);
const greet = () => { const h=new Date().getHours(); return h<12?'Good Morning':h<17?'Good Afternoon':h<22?'Good Evening':'Good Night'; };
const nowT = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const formatTimeString = (timeStr) => {
  if (!timeStr || timeStr === '--') return '--';
  const parts = timeStr.split(':');
  if (parts.length < 2) return timeStr;
  let hours = parseInt(parts[0], 10);
  const minutes = parts[1];
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12;
  const strHours = hours < 10 ? '0' + hours : hours;
  return `${strHours}:${minutes} ${ampm}`;
};
const badge = (t, ok) => `<span class="pill-3d ${ok ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}">${t}</span>`;

function toast(msg, type = 'info') {
  const container = $('#toast-container');
  if (!container) return;
  const div = document.createElement('div');
  div.className = `px-4 py-2.5 rounded-xl text-xs font-black shadow-lg pointer-events-auto transition-all transform translate-y-2 opacity-0 flex items-center gap-2 border ${
    type === 'success' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : 
    type === 'error' ? 'bg-rose-950 text-rose-300 border-rose-700' : 'bg-slate-900 text-amber-300 border-amber-500/50'
  }`;
  div.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info'}"></i> ${msg}`;
  container.appendChild(div);
  setTimeout(() => { div.classList.remove('translate-y-2', 'opacity-0'); }, 10);
  setTimeout(() => {
    div.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => div.remove(), 200);
  }, 2800);
}

function openModal(html) {
  const overlay = $('#modal-container');
  const card = $('#modal-card');
  card.innerHTML = html;
  overlay.classList.remove('hidden');
  setTimeout(() => card.classList.remove('scale-95', 'opacity-0'), 10);
}

function closeModal() {
  const overlay = $('#modal-container');
  const card = $('#modal-card');
  card.classList.add('scale-95', 'opacity-0');
  setTimeout(() => overlay.classList.add('hidden'), 150);
}

function filterData(list, fields) {
  if (!S.searchQuery) return list;
  const q = S.searchQuery.toLowerCase();
  return list.filter(item => fields.some(f => String(item[f] || '').toLowerCase().includes(q)));
}

function tbl(headers, rows) {

      <table class="w-full text-left">
        <thead class="bg-gradient-to-r from-[#050C18] to-[#0a182e] border-b border-slate-800">
          <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
        </thead>
        <tbody>${rows.length ? rows.join('') : `<tr><td colspan="${headers.length}" class="text-center py-6 text-slate-500">No records found.</td></tr>`}</tbody>

}

function getLogoSVG(sizeClass = 'w-6 h-6') {
  return `
    <svg class="sfx-logo-svg ${sizeClass}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

function acts(k, item, pSt, aSt, rSt) {
  if (item.status === pSt) {
    return `<div class="flex items-center gap-1.5">
      <button onclick="setSt('${k}','${item.id}','${aSt}')" class="pill-3d bg-gradient-to-b from-emerald-500/30 to-emerald-700/30 text-emerald-300 border border-emerald-500/50 hover:bg-emerald-500/40"><i class="fa-solid fa-circle-check"></i> Approve</button>
      ${rSt ? `<button onclick="setSt('${k}','${item.id}','${rSt}')" class="pill-3d bg-gradient-to-b from-rose-500/30 to-rose-700/30 text-rose-300 border border-rose-500/50 hover:bg-rose-500/40"><i class="fa-solid fa-circle-xmark"></i> Reject</button>` : ''}
    </div>`;
  }
  return badge(item.status, item.status === aSt);
}

function exportCSV(filename, headers, rows) {
  if (!rows || !rows.length) {
    toast('No data available to export', 'error');
    return;
  }
  const csvContent = [
    headers.join(','),
    ...rows.map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
  ].join('\n');

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', `${filename}_${S.date || 'all'}_${today}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast(`Exported ${filename}.csv`, 'success');
}

function exportSecurityDepartures() {

function calcTotalHours(inTime, outTime) {
  if (!inTime || !outTime || inTime === '--' || outTime === '--') return '--';
  const parseTimeStr = (tStr) => {
    const match = tStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if (!match) return null;
    let h = parseInt(match[1], 10);
    const m = parseInt(match[2], 10);
    const ampm = match[3].toUpperCase();
    if (ampm === 'PM' && h < 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    return h * 60 + m;
  };
  const inMins = parseTimeStr(inTime);
  const outMins = parseTimeStr(outTime);
  if (inMins === null || outMins === null) return '--';
  let diff = outMins - inMins;
  if (diff < 0) diff += 24 * 60;
  const hrs = Math.floor(diff / 60);
  const mins = diff % 60;
  return `${hrs}h ${String(mins).padStart(2, '0')}m`;
}

function login(e) {
  if (e) e.preventDefault();
  const uEl = $('#u');

  const p = pEl ? pEl.value : '';

  if (!u) {
    S.err = 'Please enter a valid Username or Employee ID.';
    return render();
  }

  // Master Manager Access
  if (u === 'admin' || u === 'manager') {
    S.user = { name: 'Portal Admin / Manager', role: 'Manager', empId: 'MGR001' };
  } else {
    // Registered User Verification
    const f = S.regs.find(r => r.id.toLowerCase() === u);
    if (!f) {
      S.err = 'User ID not registered. Please submit New User Registration for access.';
      return render();
    }
    if (f.status !== 'Approved') {
      S.err = 'Registration pending manager approval. Access denied.';
      return render();
    }
    if (f.pass && p && f.pass !== p) {
      S.err = 'Incorrect password entered.';
      return render();
    }
    S.user = { name: f.name, role: f.role, empId: f.id };
  }

  S.err = '';
  S.tab = S.user.role === 'Manager' ? 'sum' : S.user.role === 'Security' ? 'dep' : 'punch';
  toast(`Logged in as ${S.user.name} (${S.user.role})`, 'success');

function calculateHours() {
  const startVal = document.getElementById('ext_start')?.value;
  const endVal = document.getElementById('ext_end')?.value;
  const hrsInput = document.getElementById('ext_hrs');

  if (startVal && endVal && hrsInput) {
    const [sH, sM] = startVal.split(':').map(Number);
    const [eH, eM] = endVal.split(':').map(Number);
    
    let startMinutes = sH * 60 + sM;
    let endMinutes = eH * 60 + eM;

    if (endMinutes < startMinutes) {
      endMinutes += 24 * 60;
    }

    const diffMinutes = endMinutes - startMinutes;
    const hours = (diffMinutes / 60).toFixed(2);
    
    const h = Math.floor(diffMinutes / 60);
    const m = diffMinutes % 60;
    hrsInput.value = `${h}h ${String(m).padStart(2, '0')}m (${hours} hrs)`;
  }
}

      </div>
      <button onclick="logout()" class="pill-3d bg-rose-500/30 text-rose-200 hover:bg-rose-500/50 border border-rose-500/60 font-black">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  `;
}

function render() {
  renderHeader();
  const app = $('#app');
  if (!app) return;

  if (!S.user) {
    app.innerHTML = loginScreen();
    return;
  }

  if (S.user.role === 'Manager') {
    app.innerHTML = managerView();
  } else if (S.user.role === 'Security') {
    app.innerHTML = securityView();
  } else {
    app.innerHTML = employeeView();
  }
}

// Initial application boot & live clock timer setup
window.onload = function() {
  render();
  setInterval(() => {
    const topGreeting = $('#top-greeting');
    if (topGreeting) {
      const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (S.user) {
        topGreeting.innerHTML = `
          <span><i class="fa-solid fa-sun text-yellow-300"></i> ${greet()}, <b class="text-white font-black">${S.user.name}</b></span>
          <span class="text-teal-300">|</span>
          <span class="font-mono font-black text-yellow-300 bg-[#00241f] px-2.5 py-0.5 rounded-lg border border-[#00897B] shadow-inner"><i class="fa-regular fa-clock mr-1"></i>${timeNow}</span>
        `;
      } else {
        topGreeting.innerHTML = `
          <span class="font-mono font-black text-yellow-300 bg-[#00241f] px-2.5 py-0.5 rounded-lg border border-[#00897B] shadow-inner"><i class="fa-regular fa-clock mr-1"></i>${timeNow}</span>
        `;
      }
    }
  }, 1000);
};
</script>
</body>
</html>
